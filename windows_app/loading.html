<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RapidCare</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Starting RapidCare...</h1>
    <p>Initializing local servers and connecting to the network.</p>
</body>
</html>
